<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>과학적 근거 · 오늘의 쉼</title>
  <style>
    :root {
      --bg: #eceef8; --bg2: #e8eaf6; --card: #f8f9fd; --ink: #383c55; --soft: #5d6284;
      --accent: #6a72b4; --deep: #4d5490; --line: rgba(93,98,132,0.16); --line2: rgba(93,98,132,0.28);
      --glow: rgba(106,114,180,0);
    }
    :root[data-theme="midnight"] {
      --bg: #14131e; --bg2: #0e0d16; --card: #1e1d2b; --ink: #ece7da; --soft: #9a96a8;
      --accent: #d9b36a; --deep: #ecd08e; --line: rgba(236,231,218,0.12); --line2: rgba(236,220,180,0.28);
      --glow: rgba(236,216,142,0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body { max-width: 720px; margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.8; color: var(--ink);
      background: radial-gradient(120% 80% at 50% -10%, var(--bg) 0%, var(--bg2) 100%); min-height: 100vh; }
    :root[data-theme="midnight"] body {
      background: radial-gradient(120% 80% at 50% -10%, #1a1b2e 0%, #14131e 48%, #0e0d16 100%); }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); text-decoration: none;
      font-size: 0.86rem; font-weight: 600; margin-bottom: 20px; }
    .doc-eyebrow { font-size: 0.72rem; letter-spacing: 0.28em; text-indent: 0.28em; color: var(--soft);
      font-weight: 700; margin-bottom: 10px; }
    h1 { font-family: "Times New Roman", "Noto Serif KR", serif; font-size: 1.85rem; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 6px; }
    :root[data-theme="midnight"] h1 { text-shadow: 0 0 18px var(--glow); }
    h2 { font-family: "Times New Roman", "Noto Serif KR", serif; font-size: 1.28rem; font-weight: 700;
      margin: 40px 0 12px; padding-bottom: 8px; color: var(--deep);
      display: flex; align-items: baseline; gap: 12px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
    :root[data-theme="midnight"] h2 { text-shadow: 0 0 14px var(--glow); }
    h3 { font-size: 1.02rem; font-weight: 700; margin: 26px 0 8px; color: var(--ink); }
    p { margin: 10px 0; word-break: keep-all; }
    ul { margin: 10px 0 10px 2px; list-style: none; }
    li { position: relative; padding-left: 20px; margin: 7px 0; }
    li::before { content: ""; position: absolute; left: 3px; top: 0.72em; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--glow); }
    strong, b { color: var(--deep); font-weight: 700; }
    a { color: var(--accent); text-underline-offset: 3px; }
    code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86em;
      background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--deep);
      padding: 1px 6px; border-radius: 6px; }
    hr { border: none; height: 1px; background: var(--line); margin: 34px 0; }
    blockquote { margin: 18px 0; padding: 14px 18px; border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border: 1px solid var(--line2); color: var(--ink); font-size: 0.94rem;
      box-shadow: 0 0 22px var(--glow); }
    .tbl-wrap { overflow-x: auto; margin: 16px 0; border-radius: 14px; border: 1px solid var(--line); }
    table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
    th, td { padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--line);
      white-space: nowrap; }
    th { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--deep);
      font-weight: 700; }
    tr:last-child td { border-bottom: none; }
    .doc-foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
      color: var(--soft); font-size: 0.82rem; text-align: center; }
    #doc { opacity: 0; transition: opacity 0.4s ease; }
    #doc.ready { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 오늘의 쉼으로</a>
  <p class="doc-eyebrow">오 늘 의 쉼</p>
  <div id="doc">불러오는 중…</div>
  <p class="doc-foot">이 문서는 앱의 각 기능이 어떤 연구에 근거하는지 정리한 내부 지식베이스입니다.</p>

  <script>
    // 앱 테마와 동기화 (낮·밤)
    try {
      const s = JSON.parse(localStorage.getItem("settings_v2") || "{}");
      let t = s.theme;
      if (t === "dark") t = "midnight";
      else if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "garden";
      else if (t !== "midnight" && t !== "garden") t = "garden";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}

    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

    function render(md) {
      const lines = md.replace(/\r/g, "").split("\n");
      let html = "", i = 0;
      const flushList = (buf) => buf.length ? `<ul>${buf.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>` : "";
      let list = [];
      const closeList = () => { if (list.length) { html += flushList(list); list = []; } };
      while (i < lines.length) {
        const ln = lines[i];
        // 표 (연속된 | 행) — 두 번째 행이 구분선(---)
        if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
          closeList();
          const row = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
          const head = row(ln); i += 2; const body = [];
          while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(row(lines[i])); i++; }
          html += `<div class="tbl-wrap"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
          continue;
        }
        if (/^### /.test(ln)) { closeList(); html += `<h3>${inline(ln.slice(4))}</h3>`; }
        else if (/^## /.test(ln)) { closeList(); html += `<h2>${inline(ln.slice(3))}</h2>`; }
        else if (/^# /.test(ln)) { closeList(); html += `<h1>${inline(ln.slice(2))}</h1>`; }
        else if (/^> /.test(ln)) { closeList(); html += `<blockquote>${inline(ln.slice(2))}</blockquote>`; }
        else if (/^---+\s*$/.test(ln)) { closeList(); html += "<hr>"; }
        else if (/^\s*[-*] /.test(ln)) { list.push(ln.replace(/^\s*[-*] /, "")); }
        else if (ln.trim() === "") { closeList(); }
        else { closeList(); html += `<p>${inline(ln)}</p>`; }
        i++;
      }
      closeList();
      return html;
    }

    fetch("docs/SCIENCE.md")
      .then((r) => r.ok ? r.text() : Promise.reject())
      .then((md) => { const d = document.getElementById("doc"); d.innerHTML = render(md); requestAnimationFrame(() => d.classList.add("ready")); })
      .catch(() => { document.getElementById("doc").innerHTML = '<p>문서를 불러오지 못했어요. <a href="docs/SCIENCE.md">원문 보기</a></p>'; });
  </script>
</body>
</html>
